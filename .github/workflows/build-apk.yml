name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Diagnostico
        run: |
          echo "===== ARQUIVOS NA RAIZ ====="
          ls -la
          echo
          echo "===== SCRIPTS DO package.json ====="
          node -e "const p=require('./package.json'); console.log(JSON.stringify(p.scripts,null,2)); console.log('deps:', Object.keys(p.dependencies||{}).join(', ')); console.log('devDeps:', Object.keys(p.devDependencies||{}).join(', '))" || echo "FALHOU AO LER package.json"
          echo
          echo "===== PROCURA POR WEBPACK ====="
          grep -rn "webpack" --include="*.json" --include="*.js" --include="*.cjs" --include="*.mjs" . 2>/dev/null | grep -v node_modules | head -20 || echo "nenhuma referencia a webpack encontrada"
          echo
          echo "===== ULTIMO COMMIT ====="
          git log -1 --stat | head -40

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund --loglevel=verbose

      - name: Build web
        run: npm run build

      - name: Criar projeto Android
        run: npx cap add android

      - name: Aplicar plugin Kotlin e manifesto
        run: node scripts/setup-android.mjs

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ps5emushell-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
